<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <rect width="1200" height="780" fill="#0b1120"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <circle cx="36" cy="32" r="14" fill="#38bdf8"/>
  <text x="36" y="37" fill="#0b1120" font-size="10" font-weight="900" text-anchor="middle">VMF</text>
  <text x="64" y="38" fill="#f8fafc" font-size="20" font-weight="800">VMFForge <tspan fill="#38bdf8">Pro</tspan></text>
  <rect x="250" y="22" width="70" height="20" rx="4" fill="#1e293b"/>
  <text x="285" y="36" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">v1.0.0</text>
  <rect x="850" y="20" width="310" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="1005" y="38" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">MIL-STD-2045-47001 VMF CERTIFIED</text>
  <g transform="translate(40, 90)">
    <rect width="360" height="640" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">JTAC Digital 9-Line CAS Config</text>
    <rect x="20" y="70" width="320" height="50" rx="6" fill="#1e293b"/>
    <text x="36" y="100" fill="#38bdf8" font-size="13" font-family="monospace">Orig URN: 123456 | Dest: 654321</text>
    <rect x="20" y="140" width="320" height="90" rx="6" fill="#1e293b"/>
    <text x="36" y="165" fill="#f1f5f9" font-size="12">Message: K02.35 (Close Air Support)</text>
    <text x="36" y="188" fill="#34d399" font-size="12">Target: 34.5281&deg;N, 69.1723&deg;E (T-72 Tank)</text>
    <text x="36" y="211" fill="#64748b" font-size="12">Mark: Laser Code 1688 | Elev: 1250 ft</text>
    <rect x="20" y="250" width="320" height="40" rx="6" fill="#0284c7"/>
    <text x="180" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Transmit Digital 9-Line</text>
  </g>
  <g transform="translate(430, 90)">
    <rect width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">VMF MESSAGE</text>
    <text x="20" y="70" fill="#38bdf8" font-size="28" font-weight="800">K02.35</text>
    <rect x="250" y="0" width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="270" y="32" fill="#94a3b8" font-size="12" font-weight="600">COORD PRECISION</text>
    <text x="270" y="70" fill="#34d399" font-size="28" font-weight="800">2.4 <tspan font-size="16" fill="#64748b">meters</tspan></text>
    <rect x="495" y="0" width="235" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="515" y="32" fill="#94a3b8" font-size="12" font-weight="600">WIRE OVERHEAD</text>
    <text x="515" y="70" fill="#facc15" font-size="24" font-weight="800">18 <tspan font-size="16" fill="#64748b">bytes</tspan></text>
    <g transform="translate(0, 130)">
      <rect width="730" height="510" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">10-Point Normative MIL-STD-2045-47001 Compliance Scorecard</text>
      <text x="600" y="36" fill="#34d399" font-size="13" font-weight="700">10/10 PASS (100%)</text>
      <line x1="24" y1="54" x2="706" y2="54" stroke="#1e293b"/>
      <text x="36" y="86" fill="#f1f5f9" font-size="13">&#x2713; Section 5.0: Application Header Bitfield Packing (Version, URG, ACK, MsgNum)</text>
      <text x="36" y="126" fill="#f1f5f9" font-size="13">&#x2713; Section 5.3: 24-Bit Tactical Unit Reference Number (URN) Originator/Recipient</text>
      <text x="36" y="166" fill="#f1f5f9" font-size="13">&#x2713; Section 4.2: Group &amp; Field Presence Bit (GPB / FPB) Dynamic Sizing</text>
      <text x="36" y="206" fill="#f1f5f9" font-size="13">&#x2713; DACAS Standard: K02.35 Close Air Support (CAS) 9-Line Briefing Structure</text>
      <text x="36" y="246" fill="#f1f5f9" font-size="13">&#x2713; Appendix A: 23-Bit Latitude &amp; 24-Bit Longitude Range Scaling (~2.4m Precision)</text>
      <text x="36" y="286" fill="#f1f5f9" font-size="13">&#x2713; Table K02.35: Target Marking Laser PRF Code Validation (1111–1788 Band)</text>
      <text x="36" y="326" fill="#f1f5f9" font-size="13">&#x2713; Table K05.1: K05.1 Friendly Position Report (PPLI / BFT) Syntax Conformance</text>
      <text x="36" y="366" fill="#f1f5f9" font-size="13">&#x2713; Section 5.1: Flash/Immediate Urgency Prioritization &amp; Machine ACK Flags</text>
      <text x="406" y="406" fill="#f1f5f9" font-size="13">&#x2713; MIL-STD-188-220D: Combat Net Radio (CNR) Tactical Data Link Encapsulation</text>
      <text x="36" y="446" fill="#f1f5f9" font-size="13">&#x2713; Defense Ecosystem: JTAC ATAK/WinTAK, Collins TacNet &amp; Fighter Jet CAS Interop</text>
    </g>
  </g>
</svg>